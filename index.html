<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HANØR</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

#scene{
    position:fixed;
    inset:0;
}

.logo{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:6rem;
    letter-spacing:1rem;
    font-family:Arial,sans-serif;
    font-weight:200;
    z-index:10;
}

.pixel{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    opacity:0;
    animation:blink 1.3s ease-out forwards;
}

@keyframes blink{

    0%{
        opacity:0;
        transform:scale(0);
    }

    50%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:0;
        transform:scale(0);
    }

}

</style>
</head>

<body>

<div class="logo" id="logo">HANØR</div>
<div id="scene"></div>

<script src="https://cdnjs.cloudflare.com/ajaxs/r128/three.min.jsscript>

<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document
.getElementById("scene")
.appendChild(renderer.domElement);

camera.position.z = 40;

const cubes = [];

for(let i=0;i<100;i++){

    const size = Math.random()*1.5+0.5;

    const geometry =
    new THREE.BoxGeometry(
        size,
        size,
        size
    );

    const material =
    new THREE.MeshBasicMaterial({
        color:0xffffff
    });

    const cube =
    new THREE.Mesh(
        geometry,
        material
    );

    cube.position.x =
    (Math.random()-0.5)*80;

    cube.position.y =
    (Math.random()-0.5)*20;

    cube.position.z =
    (Math.random()-0.5)*50;

    cube.speed =
    Math.random()*0.02+0.01;

    cubes.push(cube);
    scene.add(cube);
}

function animate(){

    requestAnimationFrame(animate);

    cubes.forEach(cube=>{

        cube.position.x -= cube.speed;

        cube.rotation.x += 0.002;
        cube.rotation.y += 0.002;

        if(cube.position.x < -40){
            cube.position.x = 40;
        }

    });

    renderer.render(
        scene,
        camera
    );
}

animate();

/* HANØR PIXELS */

const logo =
document.getElementById("logo");

function createPixel(){

    const pixel =
    document.createElement("div");

    pixel.className = "pixel";

    const rect =
    logo.getBoundingClientRect();

    pixel.style.left =
    Math.random()*rect.width + "px";

    pixel.style.top =
    Math.random()*rect.height + "px";

    logo.appendChild(pixel);

    setTimeout(()=>{
        pixel.remove();
    },1300);
}

setInterval(()=>{

    const amount =
    Math.floor(Math.random()*5)+2;

    for(let i=0;i<amount;i++){

        setTimeout(
            createPixel,
            Math.random()*300
        );

    }

},1200);

window.addEventListener(
    'resize',
    ()=>{

        camera.aspect =
        window.innerWidth/window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
