<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HANØR</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

#scene{
    position:fixed;
    inset:0;
}

.logo{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:6rem;
    letter-spacing:1rem;
    font-weight:200;
    z-index:10;
}

.block{
    position:absolute;
    background:white;
    opacity:0;
    animation:blockPulse 1.5s ease forwards;
}

@keyframes blockPulse{

    0%{
        opacity:0;
        transform:scaleY(0);
    }

    15%{
        opacity:1;
        transform:scaleY(1);
    }

    85%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:scaleY(0);
    }

}

</style>
</head>

<body>

<div class="logo" id="logo">HANØR</div>
<div id="scene"></div>

<script src="https://cdnjs.cloudflare.com/ajaxs/r128/three.min.jsscript>

<script>

/* ==========================
   THREEJS CUBES
========================== */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({
antialias:true,
alpha:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document
.getElementById("scene")
.appendChild(renderer.domElement);

camera.position.z = 40;

const cubes = [];

for(let i=0;i<100;i++){

    const size =
    Math.random()*1.5+0.5;

    const geometry =
    new THREE.BoxGeometry(
        size,
        size,
        size
    );

    const material =
    new THREE.MeshBasicMaterial({
        color:0xffffff
    });

    const cube =
    new THREE.Mesh(
        geometry,
        material
    );

    cube.position.x =
    (Math.random()-0.5)*80;

    cube.position.y =
    (Math.random()-0.5)*20;

    cube.position.z =
    (Math.random()-0.5)*50;

    cube.speed =
    Math.random()*0.02+0.01;

    cubes.push(cube);
    scene.add(cube);
}

function animate(){

    requestAnimationFrame(animate);

    cubes.forEach(cube=>{

        cube.position.x -= cube.speed;

        cube.rotation.x += 0.002;
        cube.rotation.y += 0.002;

        if(cube.position.x < -40){
            cube.position.x = 40;
        }

    });

    renderer.render(
        scene,
        camera
    );
}

animate();

/* ==========================
   HANØR BLOCKS
========================== */

const logo =
document.getElementById("logo");

function createBlock(){

    const block =
    document.createElement("div");

    block.className = "block";

    const rect =
    logo.getBoundingClientRect();

    block.style.width = "18px";
    block.style.height = "80px";

    block.style.left =
        Math.random() * (rect.width - 20) + "px";

    block.style.top =
        Math.random() * (rect.height - 80) + "px";

    logo.appendChild(block);

    setTimeout(()=>{
        block.remove();
    },1500);

}

setInterval(()=>{

    for(let i=0;i<3;i++){

        setTimeout(
            createBlock,
            i*200
        );

    }

},2500);

/* ==========================
   RESIZE
========================== */

window.addEventListener(
'resize',
()=>{

camera.aspect =
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
