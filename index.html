/* =====================================================
   RÉGLAGES GÉNÉRAUX
===================================================== */

    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
    cursor:crosshair;

/* =====================================================
   FOND DE PARTICULES
===================================================== */

#particleCanvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:1;
    display:block;
}


/* =====================================================
   LOGOS HANØR
===================================================== */

.logo-container{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%, -50%);

    display:flex;
    flex-direction:column;
    align-items:center;

    z-index:5;

    pointer-events:none;
    user-select:none;
}

.logo{
    color:#fff;

    font-size:100px;
    font-weight:200;

    line-height:0.85;
    letter-spacing:0;

    white-space:nowrap;
}


/* =====================================================
   MONTRÉAL, QC EN BAS À GAUCHE
===================================================== */

.bottom-left{
    position:fixed;

    left:30px;
    bottom:27px;

    color:#fff;

    font-size:12px;
    font-weight:400;

    letter-spacing:3px;

    text-transform:uppercase;

    opacity:0.85;

    z-index:30;

    pointer-events:none;
    user-select:none;
}


/* =====================================================
   GENRES EN BAS À DROITE
===================================================== */

.bottom-right{
    position:fixed;

    right:30px;
    bottom:25px;

    color:#fff;

    font-size:12px;
    font-weight:400;

    line-height:1.75;
    letter-spacing:3px;

    text-transform:uppercase;
    text-align:right;

    opacity:0.85;

    z-index:30;

    pointer-events:none;
    user-select:none;
}


/* =====================================================
   LIEN SOUNDCLOUD EN HAUT À DROITE
===================================================== */

.soundcloud-link{

    position:fixed;

    left:50%;
    top:calc(50% + 290px);

    transform:translateX(-50%);

    display:flex;
    align-items:center;

    gap:12px;

    color:white;

    text-decoration:none;

    z-index:1000;

    opacity:0.85;

    cursor:pointer;

    transition:all .3s ease;

    display:flex;
    align-items:center;

    gap:11px;

    color:#fff;

    font-size:11px;
    font-weight:400;

    letter-spacing:3px;

    text-transform:uppercase;
    text-decoration:none;

    opacity:0.82;

    z-index:40;

    cursor:pointer;

    transition:
        opacity 250ms ease,
        transform 250ms ease;
}

.soundcloud-link:hover{
    opacity:1;
}

.soundcloud-link:focus-visible{
    opacity:1;

    outline:1px solid #fff;
    outline-offset:8px;
}


/* =====================================================
   LOGO SOUNDCLOUD
===================================================== */

.soundcloud-icon{
    display:block;

    width:34px;
    height:24px;

    fill:#fff;

    flex-shrink:0;
}


/* =====================================================
   GROS BLOCS BLANCS
===================================================== */

.voxel{
    position:fixed;

    width:80px;
    height:80px;

    background:#fff;

    z-index:10;

    pointer-events:none;

    animation:
        voxelAnimation
        300ms
        linear
        forwards;
}

@keyframes voxelAnimation{

    0%{
        opacity:0;
        transform:scale(0.9);
    }

    12%{
        opacity:1;
        transform:scale(1);
    }

    82%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:0;
        transform:scale(1);
    }
}


/* =====================================================
   VERSION MOBILE
===================================================== */

@media screen and (max-width:700px){

    .logo{
        font-size:18vw;
        line-height:0.86;
    }

    .voxel{
        width:55px;
        height:55px;
    }

    .bottom-left{
        left:18px;
        bottom:20px;

        font-size:9px;
        letter-spacing:2px;
    }

    .bottom-right{
        right:18px;
        bottom:18px;

        font-size:9px;
        letter-spacing:2px;
    }

    .soundcloud-link{
        top:20px;
        right:18px;

        font-size:9px;
        letter-spacing:2px;
    }

    .soundcloud-icon{
        width:28px;
        height:20px;
    }
}


/* =====================================================
   ACCESSIBILITÉ : MOUVEMENT RÉDUIT
===================================================== */

@media (prefers-reduced-motion:reduce){

    .soundcloud-link{
        transition:none;
    }

}

</style>

<body>

<!-- ==================================================

=================================================== -->

</div>


<!-- ==================================================
     TEXTE EN BAS À DROITE
=================================================== -->

<div class="bottom-right">

    HYPNOTIC<br>

    TECHNO<br>

    AMBIENT

</div>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const PARTICLE_COUNT_DESKTOP = 1800;

const PARTICLE_COUNT_MOBILE = 800;

const MOUSE_RADIUS = 320;

const MOUSE_FORCE = 0.0018;

const PARTICLE_MIN_SIZE = 0.35;

const PARTICLE_MAX_SIZE = 2.6;

const VOXEL_INTERVAL = 150;

const VOXEL_LIFETIME = 300;


/* =====================================================
   CANVAS
===================================================== */

const canvas =
document.getElementById("particleCanvas");

const ctx =
canvas.getContext("2d");

let width =
window.innerWidth;

let height =
window.innerHeight;

let centerX =
width / 2;

let centerY =
height / 2;

let devicePixelRatioValue =
Math.min(
    window.devicePixelRatio || 1,
    2
);


/* =====================================================
   SOURIS
===================================================== */

const mouse = {

    x:centerX,

    y:centerY,

    targetX:centerX,

    targetY:centerY,

    active:false

};


/* =====================================================
   PARTICULES
===================================================== */

let particles = [];

function getParticleCount(){

    if(window.innerWidth < 700){

        return PARTICLE_COUNT_MOBILE;

    }

    return PARTICLE_COUNT_DESKTOP;

}


/* =====================================================
   CRÉATION D'UNE PARTICULE 3D
===================================================== */

function createParticle(){

    return {

        x:
        (Math.random() - 0.5) *
        width *
        1.7,

        y:
        (Math.random() - 0.5) *
        height *
        1.7,

        z:
        120 +
        Math.random() *
        1100,

        velocityX:
        (Math.random() - 0.5) *
        0.08,

        velocityY:
        (Math.random() - 0.5) *
        0.08,

        velocityZ:
        0.15 +
        Math.random() *
        0.45,

        driftX:
        (Math.random() - 0.5) *
        0.012,

        driftY:
        (Math.random() - 0.5) *
        0.012,

        size:
        PARTICLE_MIN_SIZE +
        Math.random() *
        (
            PARTICLE_MAX_SIZE -
            PARTICLE_MIN_SIZE
        ),

        opacity:
        0.18 +
        Math.random() *
        0.82,

        phase:
        Math.random() *
        Math.PI *
        2

    };

}


/* =====================================================
   CRÉATION DU CHAMP DE PARTICULES
===================================================== */

function createParticles(){

    particles = [];

    const amount =
    getParticleCount();

    for(
        let i = 0;
        i < amount;
        i++
    ){

        particles.push(
            createParticle()
        );

    }

}


/* =====================================================
   REDIMENSIONNEMENT
===================================================== */

function resizeCanvas(){

    width =
    window.innerWidth;

    height =
    window.innerHeight;

    centerX =
    width / 2;

    centerY =
    height / 2;

    devicePixelRatioValue =
    Math.min(
        window.devicePixelRatio || 1,
        2
    );

    canvas.width =
    width *
    devicePixelRatioValue;

    canvas.height =
    height *
    devicePixelRatioValue;

    canvas.style.width =
    width + "px";

    canvas.style.height =
    height + "px";

    ctx.setTransform(
        devicePixelRatioValue,
        0,
        0,
        devicePixelRatioValue,
        0,
        0
    );

    if(!mouse.active){

        mouse.x =
        centerX;

        mouse.y =
        centerY;

        mouse.targetX =
        centerX;

        mouse.targetY =
        centerY;

    }

    createParticles();

}


/* =====================================================
   MOUVEMENT DE LA SOURIS
===================================================== */

window.addEventListener(
    "mousemove",
    function(event){

        mouse.targetX =
        event.clientX;

        mouse.targetY =
        event.clientY;

        mouse.active =
        true;

    }
);


/* =====================================================
   SORTIE DE LA SOURIS
===================================================== */

document.addEventListener(
    "mouseleave",
    function(){

        mouse.active =
        false;

        mouse.targetX =
        centerX;

        mouse.targetY =
        centerY;

    }
);


/* =====================================================
   SUPPORT TACTILE
===================================================== */

window.addEventListener(
    "touchmove",
    function(event){

        if(
            event.touches.length >
            0
        ){

            mouse.targetX =
            event.touches[0].clientX;

            mouse.targetY =
            event.touches[0].clientY;

            mouse.active =
            true;

        }

    },
    {
        passive:true
    }
);

window.addEventListener(
    "touchend",
    function(){

        mouse.active =
        false;

        mouse.targetX =
        centerX;

        mouse.targetY =
        centerY;

    }
);


/* =====================================================
   REMISE EN PLACE D'UNE PARTICULE
===================================================== */

function resetParticle(
    particle,
    randomDepth
){

    particle.x =
    (Math.random() - 0.5) *
    width *
    1.7;

    particle.y =
    (Math.random() - 0.5) *
    height *
    1.7;

    particle.z =
    randomDepth
    ?
    120 +
    Math.random() *
    1100
    :
    1150;

    particle.velocityX =
    (Math.random() - 0.5) *
    0.08;

    particle.velocityY =
    (Math.random() - 0.5) *
    0.08;

    particle.velocityZ =
    0.15 +
    Math.random() *
    0.45;

}


/* =====================================================
   ANIMATION 3D DES PARTICULES
===================================================== */

function animateParticles(time){

    ctx.fillStyle =
    "#000";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* Mouvement fluide du curseur */

    mouse.x +=
    (
        mouse.targetX -
        mouse.x
    ) *
    0.09;

    mouse.y +=
    (
        mouse.targetY -
        mouse.y
    ) *
    0.09;


    for(
        let i = 0;
        i < particles.length;
        i++
    ){

        const particle =
        particles[i];


        /* Mouvement vers la caméra */

        particle.z -=
        particle.velocityZ;


        /* Mouvement organique */

        particle.velocityX +=
        Math.sin(
            time *
            0.00022 +
            particle.phase
        ) *
        particle.driftX;

        particle.velocityY +=
        Math.cos(
            time *
            0.00018 +
            particle.phase
        ) *
        particle.driftY;

        particle.x +=
        particle.velocityX;

        particle.y +=
        particle.velocityY;


        /* Projection 3D */

        const perspective =
        420 /
        particle.z;

        let screenX =
        centerX +
        particle.x *
        perspective;

        let screenY =
        centerY +
        particle.y *
        perspective;


        /* Distance avec le curseur */

        const differenceX =
        mouse.x -
        screenX;

        const differenceY =
        mouse.y -
        screenY;

        const distance =
        Math.sqrt(
            differenceX *
            differenceX +
            differenceY *
            differenceY
        );


        /* Attraction vers le curseur */

        if(
            mouse.active &&
            distance < MOUSE_RADIUS &&
            distance > 1
        ){

            const attraction =
            1 -
            distance /
            MOUSE_RADIUS;

            particle.velocityX +=
            differenceX *
            MOUSE_FORCE *
            attraction /
            Math.max(
                perspective,
                0.35
            );

            particle.velocityY +=
            differenceY *
            MOUSE_FORCE *
            attraction /
            Math.max(
                perspective,
                0.35
            );

            particle.z -=
            attraction *
            1.8;

        }


        /* Limite de vitesse */

        const maximumSpeed =
        2.2;

        particle.velocityX =
        Math.max(
            -maximumSpeed,
            Math.min(
                maximumSpeed,
                particle.velocityX
            )
        );

        particle.velocityY =
        Math.max(
            -maximumSpeed,
            Math.min(
                maximumSpeed,
                particle.velocityY
            )
        );


        /* Friction */

        particle.velocityX *=
        0.992;

        particle.velocityY *=
        0.992;


        /* Nouvelle projection */

        const finalPerspective =
        420 /
        particle.z;

        screenX =
        centerX +
        particle.x *
        finalPerspective;

        screenY =
        centerY +
        particle.y *
        finalPerspective;


        /* Taille selon la profondeur */

        const depthScale =
        Math.max(
            0.15,
            Math.min(
                3.2,
                finalPerspective *
                2.5
            )
        );

        const renderedSize =
        particle.size *
        depthScale;


        /* Opacité selon la profondeur */

        const depthOpacity =
        Math.max(
            0.08,
            Math.min(
                1,
                1.25 -
                particle.z /
                1250
            )
        );

        const renderedOpacity =
        particle.opacity *
        depthOpacity;


        /* Dessiner la particule */

        ctx.fillStyle =
        "rgba(255,255,255," +
        renderedOpacity +
        ")";

        ctx.beginPath();

        ctx.arc(
            screenX,
            screenY,
            renderedSize,
            0,
            Math.PI *
            2
        );

        ctx.fill();


        /* Halo des particules proches */

        if(
            particle.z < 240 &&
            renderedSize > 1.5
        ){

            ctx.fillStyle =
            "rgba(255,255,255," +
            renderedOpacity *
            0.13 +
            ")";

            ctx.beginPath();

            ctx.arc(
                screenX,
                screenY,
                renderedSize *
                2.8,
                0,
                Math.PI *
                2
            );

            ctx.fill();

        }


        /* Recycler la particule */

        if(
            particle.z < 55 ||
            screenX < -150 ||
            screenX > width + 150 ||
            screenY < -150 ||
            screenY > height + 150
        ){

            resetParticle(
                particle,
                false
            );

        }

    }

    requestAnimationFrame(
        animateParticles
    );

}


/* =====================================================
   GROS BLOCS BLANCS
===================================================== */

function createVoxel(){

    const voxel =
    document.createElement(
        "div"
    );

    voxel.className =
    "voxel";

    voxel.style.left =
    (
        window.innerWidth /
        2 -
        220 +
        Math.random() *
        440
    ) +
    "px";

    voxel.style.top =
    (
        window.innerHeight /
        2 -
        170 +
        Math.random() *
        340
    ) +
    "px";

    document.body.appendChild(
        voxel
    );

    setTimeout(
        function(){

            voxel.remove();

        },
        VOXEL_LIFETIME
    );

}


/* =====================================================
   LANCEMENT
===================================================== */

resizeCanvas();

requestAnimationFrame(
    animateParticles
);

setInterval(
    createVoxel,
    VOXEL_INTERVAL
);

window.addEventListener(
    "resize",
    resizeCanvas
);

</script>

</body>
