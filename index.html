<!DOCTYPE html>
<html>
<head>
<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

.logo{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:100px;
    font-weight:200;
}

.voxel{
    position:absolute;
    width:80px;
    height:80px;
    background:white;
    z-index:10;
}

</style>
</head>

<body>

<div class="logo">HANØR</div>

<script>

function createVoxel(){

    const voxel =
    document.createElement("div");

    voxel.className = "voxel";

    voxel.style.left =
    (window.innerWidth/2 - 180 + Math.random()*360) + "px";

    voxel.style.top =
    (window.innerHeight/2 - 50 + Math.random()*100) + "px";

    document.body.appendChild(voxel);

    setTimeout(()=>{

        voxel.remove();

    },300);

}

setInterval(createVoxel,150);

</script>

</body>
</html>
