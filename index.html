<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HANØR</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#scene{
    position:fixed;
    inset:0;
}

.logo-container{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:10;
}

.logo{
    font-size:7rem;
    font-weight:200;
    letter-spacing:1rem;
    color:white;
    position:relative;
}

#voxelLayer{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.voxel{
    position:absolute;
    width:42px;
    height:42px;

    background:white;

    animation:voxelFlash 0.45s linear forwards;
}

@keyframes voxelFlash{

    0%{
        opacity:0;
        transform:scale(0.8);
    }

    20%{
        opacity:1;
        transform:scale(1);
    }

    80%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:scale(1.1);
    }

}

</style>
</head>

<body>

<div class="logo-container">

    <div class="logo">
        HANØR
    </div>

    <div id="voxelLayer"></div>

</div>

<div id="scene"></div>

https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.jsscript>

<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document
.getElementById("scene")
.appendChild(renderer.domElement);

camera.position.z = 40;

const cubes = [];

for(let i=0;i<120;i++){

    const size =
    Math.random()*2 + 0.5;

    const geometry =
    new THREE.BoxGeometry(
        size,size,size
    );

    const material =
    new THREE.MeshBasicMaterial({
        color:0xffffff
    });

    const cube =
    new THREE.Mesh(
        geometry,
        material
    );

    cube.position.x =
    (Math.random()-0.5)*100;

    cube.position.y =
    (Math.random()-0.5)*40;

    cube.position.z =
    (Math.random()-0.5)*60;

    cube.speed =
    Math.random()*0.03 + 0.01;

    cubes.push(cube);

    scene.add(cube);
}

function animate(){

    requestAnimationFrame(
        animate
    );

    cubes.forEach(cube=>{

        cube.position.x -= cube.speed;

        cube.rotation.x += 0.002;
        cube.rotation.y += 0.002;

        if(cube.position.x < -60){

            cube.position.x = 60;

        }

    });

    renderer.render(
        scene,
        camera
    );

}

animate();

/* ==========================
   VOXEL ANIMATION
========================== */

const voxelLayer =
document.getElementById("voxelLayer");

function spawnVoxel(){

    const voxel =
    document.createElement("div");

    voxel.className = "voxel";

    voxel.style.left =
    Math.random()*500 + "px";

    voxel.style.top =
    Math.random()*120 + "px";

    voxelLayer.appendChild(voxel);

    setTimeout(()=>{
        voxel.remove();
    },450);

}

/* new blocks every 0.4s */

setInterval(()=>{

    const count =
    Math.floor(Math.random()*5)+3;

    for(let i=0;i<count;i++){

        spawnVoxel();

    }

},400);

window.addEventListener(
'resize',
()=>{

camera.aspect =
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
