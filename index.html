<!DOCTYPE html>
<html>
<head>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

.logo-container{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    display:flex;
    flex-direction:column;

    align-items:center;

    z-index:5;
}

.logo{

    color:white;

    font-size:100px;

    font-weight:200;

    line-height:0.85;
}

.logo:nth-child(1){
    opacity:0.2;
}

.logo:nth-child(2){
    opacity:1;
}

.logo:nth-child(3){
    opacity:0.2;
}

.voxel{

    position:absolute;

    width:80px;
    height:80px;

    background:white;

    z-index:10;
}

</style>

</head>

<body>

<div class="logo-container">

    <div class="logo">HANØR</div>

    <div class="logo">HANØR</div>

    <div class="logo">HANØR</div>

</div>

<script>

function createVoxel(){

    const voxel =
    document.createElement("div");

    voxel.className = "voxel";

    voxel.style.left =
    (window.innerWidth/2 - 220 + Math.random()*440) + "px";

    voxel.style.top =
    (window.innerHeight/2 - 170 + Math.random()*340) + "px";

    document.body.appendChild(voxel);

    setTimeout(()=>{

        voxel.remove();

    },300);

}

setInterval(createVoxel,150);

</script>

</body>
</html>
