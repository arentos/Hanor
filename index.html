<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HANØR</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

#scene{
    position:fixed;
    inset:0;
}

.logo{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    color:white;

    font-size:9rem;
    font-weight:900;

    font-family:monospace;

    letter-spacing:0.3rem;

    z-index:10;

    text-rendering:pixelated;

    animation:glitch 6s infinite;
}

@keyframes glitch{

    0%{
        opacity:1;
    }

    96%{
        opacity:1;
    }

    97%{
        transform:
        translate(-50%,-50%)
        translateX(-3px);
    }

    98%{
        transform:
        translate(-50%,-50%)
        translateX(3px);
    }

    99%{
        transform:
        translate(-50%,-50%)
        translateY(-2px);
    }

    100%{
        transform:
        translate(-50%,-50%);
    }

}

</style>
</head>

<body>

<div class="logo">HANØR</div>

<div id="scene"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs//three.min.jsscript>

<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.getElementById("scene")
.appendChild(renderer.domElement);

camera.position.z = 40;

const cubes = [];

for(let i=0;i<120;i++){

    const size =
    Math.random()*2 + 1;

    const geometry =
    new THREE.BoxGeometry(
        size,
        size,
        size
    );

    const material =
    new THREE.MeshBasicMaterial({
        color:0xffffff
    });

    const cube =
    new THREE.Mesh(
        geometry,
        material
    );

    cube.position.x =
    (Math.random()-0.5)*120;

    cube.position.y =
    (Math.random()-0.5)*30;

    cube.position.z =
    (Math.random()-0.5)*60;

    cube.speed =
    Math.random()*0.03+0.01;

    cubes.push(cube);

    scene.add(cube);
}

function animate(){

    requestAnimationFrame(animate);

    cubes.forEach(cube=>{

        cube.position.x -= cube.speed;

        cube.rotation.x += 0.002;
        cube.rotation.y += 0.002;

        if(cube.position.x < -60){

            cube.position.x = 60;

        }

    });

    renderer.render(
        scene,
        camera
    );
}

animate();

window.addEventListener(
'resize',
()=>{

camera.aspect =
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
