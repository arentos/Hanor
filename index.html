<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HANØR</title>

<style>

html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    z-index:1;
}

.logo-container{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    display:flex;
    flex-direction:column;

    align-items:center;

    z-index:5;
}

.logo{
    color:white;

    font-size:100px;

    font-weight:200;

    line-height:0.85;
}

/* GROS BLOCS BLANCS */

.voxel{

    position:absolute;

    width:80px;
    height:80px;

    background:white;

    z-index:10;
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="logo-container">

    <div class="logo">HANØR</div>

    <div class="logo">HANØR</div>

    <div class="logo">HANØR</div>

</div>

<script>

/* =====================
   PARTICULES
===================== */

const canvas =
document.getElementById("bg");

const ctx =
canvas.getContext("2d");

function resize(){

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);

const particles = [];

for(let i=0;i<2500;i++){

    particles.push({

        x:Math.random()*window.innerWidth,

        y:Math.random()*window.innerHeight,

        size:Math.random()*2,

        vx:(Math.random()-0.5)*0.15,

        vy:(Math.random()-0.5)*0.15,

        opacity:
        Math.random()*0.7 + 0.1
    });

}

function animate(){

    ctx.fillStyle="black";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles.forEach(p=>{

        p.x += p.vx;
        p.y += p.vy;

        if(p.x<0) p.x=canvas.width;
        if(p.x>canvas.width) p.x=0;

        if(p.y<0) p.y=canvas.height;
        if(p.y>canvas.height) p.y=0;

        ctx.fillStyle =
        `rgba(255,255,255,${p.opacity})`;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    });

    requestAnimationFrame(
        animate
    );
}

animate();

/* =====================
   GROS BLOCS
===================== */

function createVoxel(){

    const voxel =
    document.createElement("div");

    voxel.className =
    "voxel";

    voxel.style.left =
    (window.innerWidth / 2 - 220 + Math.random()*440) + "px";

    voxel.style.top =
    (window.innerHeight / 2 - 170 + Math.random()*340) + "px";

    document.body.appendChild(
        voxel
    );

    setTimeout(()=>{

        voxel.remove();

    },300);

}

setInterval(
    createVoxel,
    150
);

</script>

</body>
</html>
